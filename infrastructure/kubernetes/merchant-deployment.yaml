apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: merchant-service
  template:
    metadata:
      labels:
        app: merchant-service
    spec:
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: merchant-service
          image: swiftdrop/merchant-service:0.1.0
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: merchant-config
            - secretRef:
                name: merchant-secrets
            - secretRef:
                name: merchant-integration-secrets
            - secretRef:
                name: merchant-webhook-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 4001
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 4001
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 4001
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
spec:
  type: ClusterIP
  selector:
    app: merchant-service
  ports:
    - port: 4001
      targetPort: 4001

