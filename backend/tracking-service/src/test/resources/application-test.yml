spring:
  datasource:
    url: jdbc:h2:mem:trackingtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS tracking
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379

app:
  gemini:
    api-key: ""
