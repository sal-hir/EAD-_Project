server:
  port: ${COURIER_PORT:4003}

spring:
  application:
    name: courier-service
  config:
    import: "optional:file:./.env[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${COURIER_DB_URL:jdbc:postgresql://localhost:5432/swiftdrop_courier}
    username: ${COURIER_DB_USER:swiftdrop}
    password: ${COURIER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${COURIER_DB_POOL_SIZE:3}
      minimum-idle: 0
  flyway:
    url: ${COURIER_MIGRATION_DB_URL:${spring.datasource.url}}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    schemas: courier
    default-schema: courier
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: courier
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  auth-url: ${AUTH_SERVICE_URL:http://localhost:4000}
  upload-dir: ${UPLOAD_DIR:./uploads}

