services:
  auth-service:
    build: ./backend/auth-service
    environment:
      AUTH_DB_URL: ${AUTH_DB_URL:?Set the Neon JDBC URL in .env}
      AUTH_MIGRATION_DB_URL: ${AUTH_MIGRATION_DB_URL:?Set the direct Neon JDBC URL in .env}
      AUTH_DB_USER: ${AUTH_DB_USER:-swiftdrop}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 bytes}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/login/oauth2/code/google}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MERCHANT_SERVICE_TOKEN: ${MERCHANT_SERVICE_TOKEN:?Set a random MERCHANT_SERVICE_TOKEN of at least 32 characters}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4000/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    restart: unless-stopped

  merchant-service:
    build: ./backend/merchant-service
    environment:
      MERCHANT_PORT: 4001
      MERCHANT_DB_URL: ${MERCHANT_DB_URL:-${AUTH_DB_URL}}
      MERCHANT_MIGRATION_DB_URL: ${MERCHANT_MIGRATION_DB_URL:-${AUTH_MIGRATION_DB_URL}}
      MERCHANT_DB_USER: ${MERCHANT_DB_USER:-${AUTH_DB_USER}}
      MERCHANT_DB_PASSWORD: ${MERCHANT_DB_PASSWORD:-${AUTH_DB_PASSWORD}}
      AUTH_SERVICE_URL: http://auth-service:4000
      AUTH_ALLOW_DOCKER_HTTP: "true"
      MERCHANT_SERVICE_TOKEN: ${MERCHANT_SERVICE_TOKEN:?Set a random MERCHANT_SERVICE_TOKEN of at least 32 characters}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "4001:4001"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4001/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_MERCHANT_API_URL: ${VITE_MERCHANT_API_URL:-http://localhost:4001}
        VITE_COURIER_API_URL: ${VITE_COURIER_API_URL:-http://localhost:4003}
    ports:
      - "3000:80"
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped

  courier-service:
    build: ./backend/courier-service
    environment:
      COURIER_PORT: 4003
      COURIER_DB_URL: ${COURIER_DB_URL:-${AUTH_DB_URL}}
      COURIER_MIGRATION_DB_URL: ${COURIER_MIGRATION_DB_URL:-${AUTH_MIGRATION_DB_URL}}
      COURIER_DB_USER: ${COURIER_DB_USER:-${AUTH_DB_USER}}
      COURIER_DB_PASSWORD: ${COURIER_DB_PASSWORD:-${AUTH_DB_PASSWORD}}
      AUTH_SERVICE_URL: http://auth-service:4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-swiftdrop}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-swiftdrop_pass}
    ports:
      - "4003:4003"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4003/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    depends_on:
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: swiftdrop
      RABBITMQ_DEFAULT_PASS: swiftdrop_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    restart: unless-stopped

  notification-service:
    build: ./backend/notification-service
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-swiftdrop}:${RABBITMQ_PASS:-swiftdrop_pass}@rabbitmq:5672
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 4005
    ports:
      - "4005:4005"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4005/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  # Old data volumes remain declared and are never migrated or deleted.
  postgres_data:
  rabbitmq_data:
  uploads_data:
  auth_postgres_data:
